version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zaychin_db
    restart: always
    environment:
      POSTGRES_USER: zaychin_user
      POSTGRES_PASSWORD: zaychin_password
      POSTGRES_DB: zaychin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaychin_user -d zaychin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zaychin_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://zaychin_user:zaychin_password@db:5432/zaychin_db
      SECRET_KEY: zaychin_production_grade_secret_key_change_me
      ENVIRONMENT: production
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost:3001","http://127.0.0.1:3001"]'
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zaychin_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8001
    ports:
      - "3001:3001"

volumes:
  postgres_data:
